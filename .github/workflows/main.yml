name: Restful-Booker CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: List files (debug)
        run: ls -la

      - name: Run Newman tests
        run: |
          COLLECTION=$(ls *.postman_collection.json | head -n 1)
          ENV_FILE=$(ls *.postman_environment.json | head -n 1)
          echo "Collection: $COLLECTION"
          echo "Environment: $ENV_FILE"
          mkdir -p reports
          newman run "$COLLECTION" -e "$ENV_FILE" \
            --reporters cli,junit \
            --reporter-junit-export reports/newman-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/
